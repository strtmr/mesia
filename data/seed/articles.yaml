# Deutscher Grundkatalog für die Einkaufsliste (Entwurf v0.1)
#
# Format: pro Kategorie-Key (siehe categories.yaml) eine Liste von Einträgen.
#   - "Name"                       → Artikel ohne Aliase
#   - "Name | Alias1, Alias2, …"   → Artikel mit Aliasen (Synonyme, regionale Begriffe, unregelmäßige Formen)
#
# Regeln:
# - Der Name ist das, was in der Liste angezeigt wird. Für Dinge, die man fast immer in der Mehrzahl kauft, ist der Name
#   in der Mehrzahl (z. B. "Erdbeeren"), dann steht die Einzahl als Alias.
# - Regelmäßige Mehrzahlformen (-n, -en, -e, -s) muss man NICHT als Alias eintragen, das erledigt die Normalisierung
#   ("Bananen" → "Banane"). Unregelmäßige Formen mit Umlautwechsel schon ("Äpfel" → Apfel).
# - Jeder Name und jeder Alias darf nach der Normalisierung nur EINMAL vorkommen (wird beim Seeden geprüft).
# - Markennamen nur als Alias, wenn sie umgangssprachlich als Gattungsbegriff dienen (Tempo, Nutella, Zewa).

