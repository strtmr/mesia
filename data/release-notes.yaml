# Neuigkeiten, die die App unter „Mehr → Neuigkeiten“ zeigt. Neueste Version oben.
#
# Bei jeder für Benutzer sichtbaren Änderung: neuen Eintrag anlegen (oder den obersten, noch nicht deployten ergänzen)
# und app.version in config/services.yaml auf dieselbe Version setzen. ReleaseNotesTest prüft das.
# Kurz und aus Sicht der Benutzer schreiben, ohne Technik. Einträge immer in '…' setzen (ein „: “ im Text würde sonst
# als Schlüssel gelesen).

- version: 0.10.0
  date: 2026-11-25
  changes:
    - 'Namen ändern unter „Mehr → Konto“. So erscheinst du bei „Hinzugefügt von …“ und in den Mitteilungen'
    - 'Passwort selbst ändern, ebenfalls unter „Mehr → Konto“. Auf diesem Gerät bleibst du angemeldet, auf allen anderen meldest du dich mit dem neuen Passwort neu an'

- version: 0.9.0
  date: 2026-11-24
  changes:
    - 'Läden: Artikel einem Supermarkt zuordnen, z. B. „Bier @Edeka“ in der Schnelleingabe oder im Bearbeiten-Fenster. Im Laden zeigt ein Filter oben nur dessen Artikel'
    - '„Gültig bis“ für Angebote: „Kaffee bis Sa“ merkt sich das Datum. Am letzten Tag steht es grün als „heute“, danach rot'
    - 'Ruhigerer Hintergrund: warmes Papierweiß statt Hellgrün'
    - 'Läden verwalten unter „Mehr → Läden“: rund 45 Märkte sind schon dabei (Discounter, Supermärkte, Bio, Drogerie, Getränke, Lieferdienste), eigene lassen sich ergänzen. Beim Tippen schlägt die App passende Läden vor'

- version: 0.8.1
  date: 2026-11-23
  changes:
    - 'Auswahlfelder passen jetzt zum Rest der App, z. B. die Häufigkeit der Mitteilungen'

- version: 0.8.0
  date: 2026-11-23
  changes:
    - 'Mitteilungen: Dein Gerät meldet sich, wenn jemand anderes etwas auf die Liste setzt. Einschalten unter „Mehr → Mitteilungen“, sofort oder gesammelt alle 15 Minuten (auf dem iPhone in der installierten App)'
    - 'Abhaken im Laden: Abgehakte Artikel bleiben kurz an ihrem Platz und wandern erst gesammelt nach „Erledigt“. So rutscht keine Zeile mehr unter dem Finger weg. Noch einmal tippen macht das Abhaken rückgängig'
    - 'Im Bearbeiten-Fenster steht, wer einen Artikel wann auf die Liste gesetzt und wer ihn erledigt hat'
    - 'In „Erledigt“ setzt jetzt der Kreis einen Artikel wieder auf die Liste, ein Tipp auf den Namen zeigt die Details'

- version: 0.7.0
  date: 2026-11-22
  changes:
    - 'Neues Aussehen: Mesia-Farben mit Signal-Orange für Knöpfe und Häkchen, Schrift Manrope und ein neues App-Symbol (M als Tisch mit Schüssel)'
    - 'Kompaktere Liste: Etwa ein Drittel mehr Einträge auf einen Blick'
    - 'Hilfe unter „Mehr“ erklärt kurz alle Funktionen'
    - 'Die Anmeldeseite erklärt, was Mesia ist'
    - 'Behoben ist, dass ein sehr langer Name mit Umlauten den Abgleich dauerhaft blockieren konnte'

- version: 0.6.1
  date: 2026-11-22
  changes:
    - '„Erledigt“ zeigt oft Gekauftes zuerst, so lässt es sich schneller wieder auf die Liste setzen'
    - 'Einmalkäufe lassen sich aus „Erledigt“ entfernen: nach links wischen, dann „Entfernen“'

- version: 0.6.0
  date: 2026-11-21
  changes:
    - 'Beim Hinzufügen bleibt die Liste sichtbar. Die Eingabe sitzt direkt über der Tastatur, der neue Artikel wird angezeigt'
    - 'Mengen lassen sich ausrechnen, z. B. „2x500g Mehl“, „3+2 Äpfel“ oder „1/2 Zitrone“'
    - 'Unplausible Mengen (z. B. zu groß) werden verständlich abgelehnt, der Text bleibt zum Korrigieren stehen'
    - 'Abhaken ohne Hinweistext: Ein kurzes Häkchen, dann wandert der Artikel nach „Erledigt“'
    - 'Lange Namen: Ab 90 Zeichen zeigt die Eingabe, wie viele noch gehen (höchstens 100)'
    - 'Behoben ist, dass beim Bearbeiten aus 1000 g versehentlich 1 g werden konnte'

- version: 0.5.0
  date: 2026-11-20
  changes:
    - 'Kategorien verwalten unter „Mehr → Kategorien“. Reihenfolge wie im Laden per Ziehen, umbenennen, eigenes Symbol, neue anlegen'
    - 'Gelöschte Kategorien: Ihre Artikel wandern nach „Sonstiges“, auch Einträge, die gerade offline hinzugefügt wurden'

- version: 0.4.1
  date: 2026-11-20
  changes:
    - 'Der überarbeitete Katalog (Mehrzahl, laktosefreie und vegane Produkte) gilt jetzt auch für eure bestehende Liste. Eigene Änderungen bleiben erhalten'

- version: 0.4.0
  date: 2026-11-20
  changes:
    - 'Obst und Gemüse heißt jetzt so, wie man es kauft: „Äpfel“, „Zwiebeln“, „Bananen“ (Einzahl wird weiter erkannt)'
    - 'Neu im Katalog sind laktosefreie und vegane Produkte, z. B. laktosefreie Milch, Hafersahne, Veggie-Hack'
    - '„Neuigkeiten“ unter „Mehr“ zeigt, was sich in jeder Version geändert hat'
    - 'Behoben ist, dass nach dem erneuten Anmelden eine technische Seite statt der Liste erschien'

- version: 0.3.0
  date: 2026-11-20
  changes:
    - 'Die App heißt jetzt Mesia und ist online erreichbar'
    - 'Die Einkaufsliste startet auch ohne Internetverbindung'
    - 'Gibt es eine neue Version, erscheint oben der Hinweis „Neu laden“'

- version: 0.2.0
  date: 2026-11-19
  changes:
    - 'Gemeinsame Einkaufsliste mit Schnelleingabe („2 l Milch“), automatischen Kategorien und Vorschlägen'
    - 'Abhaken mit „Rückgängig“, Erledigtes bleibt als Verlauf und kommt per Antippen zurück'
    - 'Artikel bearbeiten, löschen und per Ziehen umsortieren'
    - 'Änderungen gleichen sich zwischen den Geräten ab, auch nach einer Zeit ohne Verbindung'

- version: 0.1.0
  date: 2026-11-18
  changes:
    - 'Anmelden und angemeldet bleiben'
    - 'Als App auf dem Home-Bildschirm des iPhones installierbar'
