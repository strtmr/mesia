# PWA: korrekter Content-Type für das Web App Manifest.
# (Auf dem Hetzner-Webhosting mit Apache entsprechend per .htaccess: AddType application/manifest+json .webmanifest)
location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
}

# Der Service Worker soll nie aus dem HTTP-Cache kommen, damit Updates sofort ankommen.
location = /sw.js {
    add_header Cache-Control "no-cache";
}
