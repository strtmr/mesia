framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine-Transport: kein Redis/RabbitMQ nötig. Auf dem Webhosting arbeitet ein Cronjob die Queue
            # jede Minute ab: bin/console messenger:consume async --time-limit=55
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            # Nachrichtenklassen, die asynchron laufen sollen, hier dem Transport "async" zuordnen.
            # 'App\…\Message\SomeMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
