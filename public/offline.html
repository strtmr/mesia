<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · Mesuna</title>
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#01161e" media="(prefers-color-scheme: dark)">
    <style>
        :root { color-scheme: light dark; --bg: #f7f5ef; --text: #01161e; --muted: #4a6b78; --accent: #124559; --accent-contrast: #fff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #01161e; --text: #eff6e0; --muted: #aec3b0; --accent: #aec3b0; --accent-contrast: #01161e; } }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
               font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
               padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
        img { width: 72px; height: 72px; }
        h1 { font-size: 22px; margin: 16px 0 4px; }
        p { color: var(--muted); margin: 0 0 24px; }
        .button, button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 0;
                 border-radius: 12px; background: var(--accent); color: var(--accent-contrast); font: inherit;
                 font-weight: 600; text-decoration: none; margin: 4px; }
        .secondary { background: none; color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon.svg" alt="">
        <h1>Keine Verbindung</h1>
        <p>Diese Seite braucht eine Internetverbindung.<br>Die Einkaufsliste funktioniert auch offline.</p>
        <a class="button" href="/einkauf">Zur Einkaufsliste</a>
        <button type="button" class="secondary" onclick="location.reload()">Erneut versuchen</button>
    </main>
</body>
</html>
