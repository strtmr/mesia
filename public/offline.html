<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · Mealplanner</title>
    <meta name="theme-color" content="#f5f6f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
    <style>
        :root { color-scheme: light dark; --bg: #f5f6f2; --text: #1b1f1c; --muted: #6b716c; --accent: #2e7d4f; --accent-contrast: #fff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #141815; --text: #eef1ed; --muted: #9aa29b; --accent: #5cbf85; --accent-contrast: #0e1a12; } }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
               font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
               padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
        img { width: 72px; height: 72px; }
        h1 { font-size: 22px; margin: 16px 0 4px; }
        p { color: var(--muted); margin: 0 0 24px; }
        button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent);
                 color: var(--accent-contrast); font: inherit; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon.svg" alt="">
        <h1>Keine Verbindung</h1>
        <p>Diese Seite braucht eine Internetverbindung.<br>Die Einkaufsliste funktioniert ab Phase 1 auch offline.</p>
        <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
</body>
</html>
