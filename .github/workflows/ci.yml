name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" in GitHub: Prüfungen + erneutes Deployment von main

concurrency:
  group: ci-${{ github.ref }}
  # Nur bei Pull Requests abbrechen. Auf main könnte sonst ein laufendes Deployment mittendrin gestoppt werden.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Echte Umgebungsvariable: hat Vorrang vor .env/.env.test. Im Test-Env hängt Doctrine "_test" an (→ app_test).
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, apcu
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # PHPStan (phpstan-symfony) liest den kompilierten Dev-Container.
      - run: bin/console cache:warmup --env=dev

      # Dieselben Prüfungen wie im Pre-Commit-Hook, aber über alle Dateien.
      - name: GrumPHP (CS, PHPStan, deptrac, Unit-Tests, Lint, Vitest)
        run: vendor/bin/grumphp run --no-interaction

      - name: Testdatenbank vorbereiten
        run: |
          bin/console doctrine:database:create --env=test --if-not-exists
          bin/console doctrine:migrations:migrate --env=test --no-interaction
          bin/console doctrine:schema:validate --env=test

      - name: Integrationstests
        run: bin/phpunit --testsuite integration

  # Deployment auf das Webhosting, nur von main und nur wenn alle Prüfungen grün sind.
  # Einrichtung (Umgebung "production" mit Variablen und Secrets): docs/betrieb.md
  deploy:
    name: Deployment
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.DEPLOY_PHP_VERSION || '8.5' }}
          extensions: intl, pdo_pgsql
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-prod-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Release bauen
        run: deploy/build.sh "$RUNNER_TEMP/release"

      - name: SSH-Schlüssel einrichten
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Hochladen und live schalten
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '222' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PHP: ${{ vars.DEPLOY_PHP || 'php' }}
          APP_URL: ${{ vars.APP_URL }}
        run: deploy/release.sh "$RUNNER_TEMP/release"
